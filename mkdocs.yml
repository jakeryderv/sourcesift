site_name: SourceSift
site_url: https://jakevanslyke.com/sourcesift/
site_description: Python SDK and CLI for context-aware requests and source-aware research
repo_url: https://github.com/jakeryderv/sourcesift
edit_uri: blob/main/docs/
strict: true

nav:
  - Overview: index.md
  - Use cases: use-cases.md
  - Design: design.md
  - Roadmap: roadmap.md
  - Interactive chat: chat.md
  - Command line: cli.md
  - Python SDK: sdk.md
  - Research and sources: research.md
  - Configuration: configuration.md
  - API reference: reference/index.md

exclude_docs: |
  /capstone/

theme:
  name: mkdocs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true

validation:
  links:
    not_found: warn
    anchors: warn
