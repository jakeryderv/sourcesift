minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]
exclude: ^docs/capstone/

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint (safe fixes)
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: ty
        name: Type check project
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: pytest
        name: Offline tests
        entry: uv run --locked python -m pytest -q -m 'not network'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: release-metadata
        name: Release metadata consistency
        entry: uv run --locked python scripts/release_checks.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
