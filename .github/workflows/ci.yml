name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.18"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked ty check

  build:
    name: Build and validate distributions
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.18"
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv build --no-sources
      - run: uv run --locked twine check --strict dist/*
      - name: Install and import each distribution
        shell: bash
        run: |
          for distribution in dist/*.whl dist/*.tar.gz; do
            smoke_env="$RUNNER_TEMP/sourcesift-smoke"
            uv venv "$smoke_env" --python 3.14 --clear
            uv pip install --python "$smoke_env/bin/python" "$distribution"
            "$smoke_env/bin/python" -I -c 'import sourcesift; from importlib.metadata import version; print("Installed sourcesift", version("sourcesift"))'
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

