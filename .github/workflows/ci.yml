name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Release PR number (required when dispatching on a PR branch)
        type: string
        default: ""
  workflow_call:

permissions:
  contents: read
  pull-requests: read

# Superseded PR runs may be canceled; main and publication runs stay independent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: Quality, docs, and release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.18"
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run --locked python scripts/check.py --quality-only
      - name: Build documentation
        run: uv run --locked --group docs mkdocs build --strict
      - name: Upload documentation preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: site/
          retention-days: 7
          if-no-files-found: error
      - name: Validate versions and PR policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          uv run --locked python scripts/release_checks.py
          if [[ -n "$PR_NUMBER" ]]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              uv run --locked python scripts/release_checks.py --pr-json "$RUNNER_TEMP/pr.json" --head-sha "$GITHUB_SHA"
            else
              uv run --locked python scripts/release_checks.py --pr-json "$RUNNER_TEMP/pr.json"
            fi
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "PR branch dispatch requires pr_number" >&2
            exit 1
          fi
      - name: Cache pinned workflow linter
        id: actionlint-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/bin/actionlint
          key: ${{ runner.os }}-${{ runner.arch }}-actionlint-1.7.12
      - name: Install pinned workflow linter on cache miss
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          GOBIN="$HOME/.local/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: '"$HOME/.local/bin/actionlint"'

  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.18"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - name: Test
        if: matrix.python-version != '3.14'
        run: uv run --locked python -m pytest -q -m 'not network'
      - name: Test with branch coverage
        if: matrix.python-version == '3.14'
        run: |
          uv run --locked python -m pytest -q -m 'not network' --cov --cov-report=html --cov-report=xml
          uv run --locked coverage report --include='src/sourcesift/*'
          uv run --locked coverage report --include='scripts/*'
      - name: Upload coverage reports
        if: ${{ !cancelled() && matrix.python-version == '3.14' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7
          if-no-files-found: warn

  build:
    name: Build and validate distributions
    needs: [check, policy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.18"
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv build --no-sources
      - run: uv run --locked twine check --strict dist/*
      - name: Install and import each distribution
        shell: bash
        run: |
          for distribution in dist/*.whl dist/*.tar.gz; do
            smoke_env="$RUNNER_TEMP/sourcesift-smoke"
            uv venv "$smoke_env" --python 3.14 --clear
            uv pip install --python "$smoke_env/bin/python" "$distribution"
            "$smoke_env/bin/python" -I -c 'import sourcesift; from importlib.metadata import version; print("Installed sourcesift", version("sourcesift"))'
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  result:
    name: CI
    if: always()
    needs: [policy, check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          if any(job["result"] != "success" for job in results.values()):
              raise SystemExit("A required CI job failed or was skipped")
          PY
