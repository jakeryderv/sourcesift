[project]
name = "sourcesift"
version = "0.1.0"
description = "A Python SDK and CLI for context-aware requests, with source-aware research in development."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jake Van Slyke", email = "jakervanslyke@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
    "cyclopts>=5.2.0,<6",
    "openai>=3.31,<4",
    "platformdirs>=4.13.0,<5",
    "pydantic>=2.14.1,<3",
    "pydantic-ai-slim[openrouter]>=2.56.0,<3",
    "pydantic-settings>=2.16.0,<3",
    "rich>=15.0,<16",
]

[project.scripts]
ssift = "sourcesift.cli:main"

[project.urls]
Repository = "https://github.com/jakeryderv/sourcesift"
Issues = "https://github.com/jakeryderv/sourcesift/issues"
Documentation = "https://jakevanslyke.com/sourcesift/"

[dependency-groups]
dev = [
  "packaging>=26.3",
  "pre-commit>=4.7.0,<5",
  "pytest>=9.1.1",
  "ruff>=0.17.0",
  "ty>=0.0.87",
  "twine>=6.2.0,<7",
  "pytest-cov>=7.1,<8",
  "hypothesis>=6.169,<7",
  "pytest-asyncio>=1.4.0",
  "httpx2>=2.13,<3",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocstrings[python]>=1.0.7,<2",
]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = ["network: requires external services or API credentials; opt in explicitly"]

[tool.coverage.run]
branch = true
source = ["src/sourcesift", "scripts"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
# Aggregate tooling coverage is informational; CI separately requires 90% application coverage.
fail_under = 0

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
